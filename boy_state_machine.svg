<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 24px sans-serif; fill: #0f172a; }
      .label { font: 600 18px sans-serif; fill: #0f172a; }
      .note { font: 16px sans-serif; fill: #334155; }
      .line { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1000" height="580" fill="#f8fafc"/>
  <text x="500" y="42" text-anchor="middle" class="title">Boy State Machine</text>
  <circle cx="180" cy="235" r="82" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="180" y="243" text-anchor="middle" class="label">IDLE</text>
  <circle cx="500" cy="235" r="82" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="500" y="243" text-anchor="middle" class="label">RUN</text>
  <circle cx="820" cy="235" r="82" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="820" y="243" text-anchor="middle" class="label">SLEEP</text>
  <circle cx="500" cy="490" r="100" fill="#fce7f3" stroke="#db2777" stroke-width="3"/>
  <text x="500" y="498" text-anchor="middle" class="label">AUTO_RUN</text>
  <path d="M262 215 H418" class="line"/>
  <text x="340" y="175" text-anchor="middle" class="note">Left / Right key down</text>
  <text x="340" y="199" text-anchor="middle" class="note">start_run()</text>
  <path d="M418 255 H262" class="line"/>
  <text x="340" y="307" text-anchor="middle" class="note">Both direction keys up</text>
  <text x="340" y="331" text-anchor="middle" class="note">stop_run()</text>
  <path d="M180 317 C180 400 330 420 400 450" class="line"/>
  <text x="260" y="405" text-anchor="middle" class="note">A 키: start_auto_run()</text>
  <path d="M262 235 C315 100 685 100 738 235" class="line"/>
  <text x="500" y="92" text-anchor="middle" class="note">5초 경과: sleep()</text>
  <path d="M738 255 C685 390 315 390 262 255" class="line"/>
  <text x="500" y="425" text-anchor="middle" class="note">Space 키: wake_up()</text>
  <path d="M820 317 C780 510 540 510 500 317" class="line"/>
  <text x="660" y="530" text-anchor="middle" class="note">Left / Right key down: start_run_from_sleep()</text>
  <path d="M400 450 C330 420 260 400 180 317" class="line"/>
  <text x="285" y="475" text-anchor="middle" class="note">5초 경과: stop_auto_run()</text>
  <path d="M500 390 V317" class="line"/>
  <text x="570" y="360" text-anchor="middle" class="note">Left / Right key down</text>
  <text x="570" y="384" text-anchor="middle" class="note">start_run_from_auto()</text>
  <path d="M98 235 H40" class="line"/>
  <text x="40" y="210" text-anchor="middle" class="note">initial</text>
  <text x="500" y="625" text-anchor="middle" class="note">AUTO_RUN: 방향키 없이 좌우 자동 이동, 화면 경계에서 방향 반전, 5초 후 IDLE</text>
  <text x="500" y="655" text-anchor="middle" class="note">AUTO_RUN은 RUN보다 빠르고 크게 표시되며 땅 위에 맞춰집니다.</text>
  <text x="500" y="678" text-anchor="middle" class="note">AUTO_RUN 중심 x는 확대된 스프라이트 폭을 기준으로 화면 안에 제한됩니다.</text>
</svg>
